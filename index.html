<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Deteksi Objek Kamera</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 18px; margin: 8px 0 16px; }
  #stage {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  /* PENTING: video TIDAK di-transform, jadi tidak terbalik/mirror */
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: #9ad;
    min-height: 18px;
  }
  #list {
    margin-top: 12px;
    width: 100%;
    max-width: 640px;
    font-size: 14px;
  }
  #list div {
    padding: 4px 8px;
    background: #222;
    margin-bottom: 4px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
  }
  button {
    margin-top: 12px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #2a7;
    color: #fff;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>📷 Deteksi Objek Real-time</h1>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>
<div id="status">Memuat model...</div>
<button id="switchBtn">Ganti Kamera</button>
<div id="list"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const switchBtn = document.getElementById('switchBtn');

let currentStream = null;
let facingMode = 'environment'; // kamera belakang default, bukan mirror
let model = null;

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode }
    });
  } catch (e) {
    // fallback kalau facingMode gagal (mis. laptop tanpa kamera belakang)
    currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
  }
  video.srcObject = currentStream;
  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

async function loadModel() {
  statusEl.textContent = 'Memuat model deteksi objek...';
  model = await cocoSsd.load();
  statusEl.textContent = 'Model siap. Mendeteksi...';
}

function drawPredictions(predictions) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  listEl.innerHTML = '';

  predictions.forEach(p => {
    const [x, y, w, h] = p.bbox;
    ctx.strokeStyle = '#22e07a';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    const label = `${p.class} ${(p.score * 100).toFixed(0)}%`;
    ctx.font = '16px sans-serif';
    const textWidth = ctx.measureText(label).width;
    ctx.fillStyle = '#22e07a';
    ctx.fillRect(x, y > 20 ? y - 20 : y, textWidth + 8, 20);
    ctx.fillStyle = '#000';
    ctx.fillText(label, x + 4, y > 20 ? y - 5 : y + 15);

    const row = document.createElement('div');
    row.innerHTML = `<span>${p.class}</span><span>${(p.score*100).toFixed(0)}%</span>`;
    listEl.appendChild(row);
  });
}

async function detectLoop() {
  if (model && video.readyState === 4) {
    const predictions = await model.detect(video);
    drawPredictions(predictions);
  }
  requestAnimationFrame(detectLoop);
}

switchBtn.addEventListener('click', async () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  statusEl.textContent = 'Mengganti kamera...';
  await startCamera();
  statusEl.textContent = 'Mendeteksi...';
});

(async function init() {
  await startCamera();
  await loadModel();
  detectLoop();
})();
</script>

</body>
</html>
