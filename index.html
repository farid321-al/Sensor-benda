<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sensor Pendeteksi Benda</title>
<style>
  :root{
    --bg: #0b0f14;
    --accent: #5eead4;
    --accent2: #f472b6;
    --text: #e7edf3;
    --muted: #7c8b9a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100%; width: 100%;
  }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  canvas#overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
    z-index: 3;
  }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-top)) 16px;
    z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #hud .title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #hud .status { margin-top: 4px; font-size: 14px; font-weight: 600; }
  #status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-right:6px; }
  #status-dot.live { background: var(--accent); }

  #detectedList {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    gap: 8px;
    padding: 0 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #detectedList::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    background: rgba(16,22,29,0.88);
    border: 1px solid rgba(94,234,212,0.4);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .chip .pct { color: var(--accent); font-weight: 700; margin-left: 4px; }

  #startOverlay {
    position: absolute; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 30%, #16202b, #0b0f14 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  #startOverlay h1 { font-size: 21px; margin-bottom: 8px; }
  #startOverlay p { color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.5; margin-bottom: 22px; }
  #startBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #06110e; border: none; padding: 14px 32px; border-radius: 999px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #loading { display:none; margin-top:16px; color: var(--muted); font-size: 13px; }
  #errorBox { display:none; margin-top:16px; color:#f87171; font-size:13px; max-width:320px; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div>
      <div class="title">Sensor Pendeteksi Benda</div>
      <div class="status"><span id="status-dot"></span><span id="status-text">Menunggu kamera</span></div>
    </div>
  </div>

  <div id="detectedList"></div>

  <div id="startOverlay">
    <h1>Deteksi benda di sekitar</h1>
    <p>Izinkan akses kamera. Arahkan kamera ke benda seperti gelas, HP, kursi, buku, dll — nanti nama & tingkat keyakinannya muncul otomatis.</p>
    <button id="startBtn">Aktifkan Kamera</button>
    <div id="loading">Memuat model AI deteksi benda…</div>
    <div id="errorBox"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const errorBox = document.getElementById('errorBox');
const loading = document.getElementById('loading');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const detectedList = document.getElementById('detectedList');

// Terjemahan label umum ke Bahasa Indonesia biar lebih mudah dibaca
const labelID = {
  person: 'Orang', bicycle: 'Sepeda', car: 'Mobil', motorcycle: 'Motor',
  bus: 'Bus', train: 'Kereta', truck: 'Truk', 'traffic light': 'Lampu lalu lintas',
  bench: 'Bangku', bird: 'Burung', cat: 'Kucing', dog: 'Anjing',
  backpack: 'Tas ransel', umbrella: 'Payung', handbag: 'Tas tangan', tie: 'Dasi',
  suitcase: 'Koper', bottle: 'Botol', 'wine glass': 'Gelas anggur', cup: 'Gelas/Cangkir',
  fork: 'Garpu', knife: 'Pisau', spoon: 'Sendok', bowl: 'Mangkuk',
  banana: 'Pisang', apple: 'Apel', sandwich: 'Sandwich', orange: 'Jeruk',
  chair: 'Kursi', couch: 'Sofa', 'potted plant': 'Tanaman pot', bed: 'Tempat tidur',
  'dining table': 'Meja makan', toilet: 'Toilet', tv: 'TV', laptop: 'Laptop',
  mouse: 'Mouse', remote: 'Remote', keyboard: 'Keyboard', 'cell phone': 'Handphone',
  microwave: 'Microwave', oven: 'Oven', toaster: 'Pemanggang roti', sink: 'Wastafel',
  refrigerator: 'Kulkas', book: 'Buku', clock: 'Jam', vase: 'Vas',
  scissors: 'Gunting', 'teddy bear': 'Boneka beruang', 'hair drier': 'Pengering rambut',
  toothbrush: 'Sikat gigi'
};
function toID(label){ return labelID[label] || label; }

let model = null;

function onResize(){
  overlay.width = overlay.clientWidth;
  overlay.height = overlay.clientHeight;
}
window.addEventListener('resize', onResize);

function colorFor(label){
  // warna konsisten per jenis benda, berdasarkan hash sederhana dari nama label
  let h = 0;
  for(let i=0;i<label.length;i++) h = (h*31 + label.charCodeAt(i)) % 360;
  return `hsl(${h}, 80%, 60%)`;
}

async function detectLoop(){
  if(model && video.readyState === 4){
    const predictions = await model.detect(video);
    ctx.clearRect(0,0,overlay.width, overlay.height);

    const scaleX = overlay.width / video.videoWidth;
    const scaleY = overlay.height / video.videoHeight;

    let html = '';
    predictions
      .filter(p => p.score > 0.55)
      .sort((a,b)=> b.score - a.score)
      .forEach(p=>{
        const [x, y, w, h] = p.bbox;
        const bx = x * scaleX, by = y * scaleY, bw = w * scaleX, bh = h * scaleY;
        const color = colorFor(p.class);
        const label = toID(p.class);
        const pct = Math.round(p.score * 100);

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(bx, by, bw, bh);

        // label text - digambar terbalik karena canvas di-mirror lewat CSS,
        // supaya teksnya kebaca normal (nggak mirror)
        ctx.save();
        ctx.translate(bx + bw/2, by > 24 ? by - 8 : by + 18);
        ctx.scale(-1, 1); // lawan mirror css supaya teks terbaca normal
        ctx.font = 'bold 15px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        const text = `${label} ${pct}%`;
        const textW = ctx.measureText(text).width;
        ctx.fillStyle = color;
        ctx.fillRect(-textW/2 - 6, -16, textW + 12, 22);
        ctx.fillStyle = '#06110e';
        ctx.fillText(text, 0, 1);
        ctx.restore();

        html += `<div class="chip">${label}<span class="pct">${pct}%</span></div>`;
      });

    detectedList.innerHTML = html || '';
    statusText.textContent = predictions.length ? `${predictions.length} benda terdeteksi` : 'Mengamati…';
  }
  requestAnimationFrame(detectLoop);
}

async function start(){
  loading.style.display = 'block';
  errorBox.style.display = 'none';
  startBtn.disabled = true;

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 960 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    onResize();

    model = await cocoSsd.load();

    statusDot.classList.add('live');
    startOverlay.style.display = 'none';
    detectLoop();
  } catch(err){
    loading.style.display = 'none';
    startBtn.disabled = false;
    errorBox.style.display = 'block';
    errorBox.textContent = 'Gagal mengakses kamera: ' + err.message + '. Pastikan izin kamera diaktifkan dan halaman dibuka lewat HTTPS.';
  }
}
startBtn.addEventListener('click', start);
</script>
</body>
</html>
